<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Download ❄️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap');

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(180deg, #dff6ff, #b8e8ff);
    position: relative;
}

/* Snowfall */
.snowflake {
    position: absolute;
    top: -10px;
    color: white;
    font-size: 1.2rem;
    opacity: 0.8;
    animation: fall linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
    }
}

/* Card */
.container {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
    width: 340px;
}

h1 {
    margin-bottom: 10px;
    color: #4c6e91;
}

p {
    color: #6f89a6;
    margin-bottom: 20px;
}

input {
    width: 85%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    margin-bottom: 15px;
    font-size: 16px;
    background: #f3fbff;
}

button {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    background: #7fcdf7;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: 0.2s ease;
}

button:hover {
    transform: scale(1.05);
    background: #67bde9;
}

.error {
    margin-top: 12px;
    color: #d44;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
    <h1>❄ Winter Pack ❄</h1>
    <p>Enter the password to unlock your download</p>

    <input type="password" id="pw" placeholder="Password...">
    <br>
    <button onclick="checkPassword()">Unlock</button>

    <div class="error" id="error"></div>
</div>

<script>
const PASSWORD = "thewarmthyoufeelinthecold";

function checkPassword() {
    const entered = document.getElementById("pw").value;

    if (entered === PASSWORD) {
        window.location.href = "https://file.kiwi/3008da09#GYWCQcHph7SmNXrPVWGZrA";
    } else {
        document.getElementById("error").textContent = "Wrong password ❄";
    }
}

// Snowflakes
for(let i = 0; i < 40; i++) {
    let snow = document.createElement("div");
    snow.classList.add("snowflake");
    snow.innerHTML = "❄";
    snow.style.left = Math.random() * 100 + "vw";
    snow.style.animationDuration = (5 + Math.random() * 10) + "s";
    snow.style.fontSize = (10 + Math.random() * 20) + "px";
    document.body.appendChild(snow);
}
</script>

</body>
</html>
